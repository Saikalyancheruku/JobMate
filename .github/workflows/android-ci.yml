name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test, lint, and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37 packages
        run: sdkmanager --install "cmdline-tools;latest" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compute SemVer build identifier
        id: app-version
        shell: bash
        run: |
          base_version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH (got: $base_version)" >&2
            exit 1
          fi
          if (( GITHUB_RUN_ATTEMPT < 1 || GITHUB_RUN_ATTEMPT > 999 )); then
            echo "GITHUB_RUN_ATTEMPT must be between 1 and 999" >&2
            exit 1
          fi
          version_code=$((1000000 + GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          if (( version_code > 2100000000 )); then
            echo "Calculated Android versionCode exceeds 2100000000" >&2
            exit 1
          fi
          echo "name=${base_version}+ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests, lint, and assemble debug APK
        env:
          JOBMATE_VERSION_NAME: ${{ steps.app-version.outputs.name }}
          JOBMATE_VERSION_CODE: ${{ steps.app-version.outputs.code }}
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug "-PjobmateVersionName=$JOBMATE_VERSION_NAME" "-PjobmateVersionCode=$JOBMATE_VERSION_CODE"

      - name: Export APK signing certificate details
        if: ${{ always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        id: apk-certificate
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          certificate_file="app/build/outputs/apk/debug/app-debug-certificate.txt"
          "$apksigner" verify --print-certs --print-certs-pem "$apk" > "$certificate_file"
          sha1="$(sed -n 's/.*certificate SHA-1 digest: //p' "$certificate_file" | head -n 1)"
          if [[ -z "$sha1" ]]; then
            echo "Could not read the APK signing certificate SHA-1." >&2
            exit 1
          fi
          echo "sha1=$sha1" >> "$GITHUB_OUTPUT"
          {
            echo "## Debug APK signing certificate"
            echo "- APK: app-debug.apk"
            echo "- SHA-1: $sha1"
            echo "- Full public certificate is included in the downloadable artifact as app-debug-certificate.txt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: ${{ always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: jobmate-debug-${{ steps.app-version.outputs.name }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug-certificate.txt
          if-no-files-found: warn
          retention-days: 14
